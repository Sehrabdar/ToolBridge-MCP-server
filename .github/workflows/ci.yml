name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Quality & unit tests (no external services)
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — formatting check
        run: uv run ruff format --check .

      - name: mypy — type check
        run: uv run mypy .

      - name: pytest — unit tests
        run: uv run pytest tests/unit/ -v

  # ---------------------------------------------------------------------------
  # Integration tests (requires PostgreSQL)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toolbridge
          POSTGRES_PASSWORD: toolbridge
          POSTGRES_DB: toolbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolbridge -d toolbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://toolbridge:toolbridge@localhost:5432/toolbridge_test
      TEST_DATABASE_URL: postgresql+asyncpg://toolbridge:toolbridge@localhost:5432/toolbridge_test
      APP_ENV: development
      LOG_LEVEL: DEBUG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest — integration tests
        run: uv run pytest tests/integration/ -m integration -v
