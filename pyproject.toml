[project]
name = "toolbridge"
version = "0.1.0"
description = "Secure Multi-Tool MCP Server — Phase 1: Project Foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Web framework — minimal FastAPI for /health endpoint (Phase 1) and future auth layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # MCP SDK — official Python MCP SDK; transport/tool registration used in later phases
    "mcp>=1.9.0",
    # Database — async PostgreSQL driver + SQLAlchemy async ORM
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # Database migrations
    "alembic>=1.14.0",
    # Configuration — typed settings from environment variables
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # Structured logging
    "structlog>=24.4.0",
]

[project.scripts]
toolbridge = "toolbridge.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbridge"]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    # Type stubs
    "types-python-dateutil",
    # Quality tools
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hint enforcement)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN",  # Type annotation rules — enforced by mypy instead
]

[tool.ruff.lint.isort]
known-first-party = ["toolbridge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require external services (deselect with '-m \"not integration\"')",
]
