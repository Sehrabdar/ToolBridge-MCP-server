services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — primary data store
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: toolbridge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolbridge
      POSTGRES_PASSWORD: toolbridge
      POSTGRES_DB: toolbridge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbridge -d toolbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ToolBridge application
  #
  # Disabled by default in Phase 1 because the app image requires a production
  # build (``docker build``).  Uncomment when you want to run the full stack.
  #
  # For local development use:
  #   docker compose up -d db
  #   uv run uvicorn toolbridge.main:app --reload
  # ---------------------------------------------------------------------------
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: toolbridge_app
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     APP_ENV: development
  #     LOG_LEVEL: INFO
  #     DATABASE_URL: postgresql+asyncpg://toolbridge:toolbridge@db:5432/toolbridge
  #   ports:
  #     - "8000:8000"
  #   healthcheck:
  #     test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 15s

volumes:
  postgres_data:
    driver: local
